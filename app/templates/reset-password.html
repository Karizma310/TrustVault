<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f9ff">
  <title>Reset password — TrustVault</title>
  <link rel="stylesheet" href="../static/css/trustvault.css">
  <script src="../static/js/trustvault.js" defer></script>
</head>
<body class="login-page">
  <header class="login-header">
    <a class="brand" href="landing.html" aria-label="TrustVault home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.8 27 7v8.2c0 7.1-4.6 11.5-11 14-6.4-2.5-11-6.9-11-14V7l11-4.2Z" fill="currentColor"/><path d="m11.1 15.6 3.2 3.2 6.9-7.2" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/></svg>
      <span>Trust<span class="brand-accent">Vault</span></span>
    </a>
    <a class="login-back-link" href="login.html"><span aria-hidden="true">←</span> Back to sign in</a>
  </header>
  <main class="login-main">
    <section class="login-card" aria-labelledby="reset-title">
      <div class="login-art-panel">
        <div class="login-art-brand"><span class="login-shield"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.8 27 7v8.2c0 7.1-4.6 11.5-11 14-6.4-2.5-11-6.9-11-14V7l11-4.2Z"/><path d="m11.1 15.6 3.2 3.2 6.9-7.2"/></svg></span><span><strong>Regain access securely.</strong><small>Reset your password using a one-time link.</small></span></div>
        <div class="login-document-art" role="img" aria-label="Protected document illustration"><div class="login-doc-sheet"><i></i><i></i><i></i><i></i></div><span class="login-doc-shield"><svg viewBox="0 0 32 36" aria-hidden="true"><path d="M16 2 28 7v9c0 8-5 13-12 17C9 29 4 24 4 16V7L16 2Z"/><rect x="11" y="15" width="10" height="9" rx="1.5"/><path d="M13 15v-3a3 3 0 0 1 6 0v3"/></svg></span></div>
        <p class="login-art-caption">Secure. Manage. Control.</p>
      </div>
      <div class="login-form-panel">
        <div class="login-form-heading"><span class="eyebrow"><span class="eyebrow-dot"></span> Account recovery</span><h1 id="reset-title">Reset your password</h1><p>We’ll help you securely regain access to your vault.</p></div>
        <form class="auth-form" data-password-reset-request>
          <label class="form-label" for="reset-email">Email address</label>
          <div class="input-with-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg><input id="reset-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
          <button class="button button-primary login-submit" type="submit">Send reset instructions <span aria-hidden="true">→</span></button>
          <p class="preview-notice" role="status" aria-live="polite" data-password-reset-request-status></p>
        </form>
        <form class="auth-form" data-password-reset-confirm hidden>
          <label class="form-label" for="reset-new-password">New password</label>
          <div class="input-with-icon password-input-wrap"><input id="reset-new-password" name="new_password" type="password" autocomplete="new-password" minlength="12" maxlength="128" placeholder="At least 12 characters" required><button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" data-password-toggle>Show</button></div>
          <label class="form-label" for="reset-confirm-password">Confirm new password</label>
          <div class="input-with-icon password-input-wrap"><input id="reset-confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" maxlength="128" placeholder="Re-enter your password" required><button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" data-password-toggle>Show</button></div>
          <button class="button button-primary login-submit" type="submit">Update password <span aria-hidden="true">→</span></button>
          <p class="preview-notice" role="status" aria-live="polite" data-password-reset-confirm-status></p>
        </form>
        <p class="login-signup"><a href="login.html">Return to sign in</a></p>
      </div>
    </section>
    <p class="login-privacy">Reset links expire and can only be used once.</p>
  </main>
</body>
</html>
